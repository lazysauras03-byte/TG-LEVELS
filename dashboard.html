<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>EMA9 Signal Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body,
    #root {
      height: 100%;
      background: #0a0e1a
    }

    body {
      font-family: 'Inter', sans-serif;
      color: #e2e8f0;
      overflow: hidden
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px
    }

    ::-webkit-scrollbar-track {
      background: #0d1221
    }

    ::-webkit-scrollbar-thumb {
      background: #2a3555;
      border-radius: 2px
    }

    @keyframes spin {
      from {
        transform: rotate(0deg)
      }

      to {
        transform: rotate(360deg)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    "use strict";
    // ─── Destructure React hooks ────────────────────────────────────────────────
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    // ─── API utils ───────────────────────────────────────────────────────────────
    const BASE = "";  // always relative — works on localhost AND ngrok
    async function apiFetch(url) {
      const res = await fetch(BASE + url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    async function fetchChartData(symbol, resolution, timeframe, date) {
      let url = "/api/chart?symbol=" + encodeURIComponent(symbol) + "&resolution=" + resolution + "&timeframe=" + timeframe;
      if (date) url += "&date=" + date;
      return apiFetch(url);
    }
    async function fetchChartRangeData(symbol, resolution, fromDate, toDate) {
      let url = "/api/chart-range?symbol=" + encodeURIComponent(symbol) + "&resolution=" + resolution;
      if (fromDate) url += "&fromDate=" + fromDate;
      if (toDate) url += "&toDate=" + toDate;
      return apiFetch(url);
    }
    function createWebSocket() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      return new WebSocket(proto + "//" + window.location.host);
    }

    // ─── Routing (tiny hash-router — no build needed) ───────────────────────────
    function useRoute() {
      const parse = () => {
        const hash = window.location.hash.replace(/^#/, "") || "/chart";
        const [path, qs] = hash.split("?");
        const params = Object.fromEntries(new URLSearchParams(qs || ""));
        const symMatch = path.match(/^\/chart\/(.+)$/);
        return { path, symbol: symMatch ? decodeURIComponent(symMatch[1]) : null, params };
      };
      const [route, setRoute] = useState(parse);
      useEffect(() => {
        const h = () => setRoute(parse());
        window.addEventListener("hashchange", h);
        return () => window.removeEventListener("hashchange", h);
      }, []);
      return route;
    }
    function navigate(symbol, params) {
      const qs = params && Object.keys(params).length ? "?" + new URLSearchParams(params).toString() : "";
      const sym = symbol ? "/" + encodeURIComponent(symbol) : "";
      window.location.hash = "/chart" + sym + qs;
    }

    // ─── Hooks ───────────────────────────────────────────────────────────────────
    function useChartData(symbol, resolution, timeframe, date, fromDate, toDate) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const abortRef = useRef(null);
      const isRange = !!(fromDate && toDate);

      const load = useCallback(async () => {
        if (!symbol) return;
        if (abortRef.current) abortRef.current.abort();
        abortRef.current = new AbortController();
        setLoading(true); setError(null);
        try {
          const result = isRange
            ? await fetchChartRangeData(symbol, resolution, fromDate, toDate)
            : await fetchChartData(symbol, resolution, timeframe, date);
          setData(result);
        } catch (e) {
          if (e.name !== "AbortError") setError(e.message);
        } finally { setLoading(false); }
      }, [symbol, resolution, timeframe, date, fromDate, toDate, isRange]);

      useEffect(() => { load(); }, [load]);
      return { data, loading, error, reload: load };
    }

    function useWebSocket(onMessage) {
      const wsRef = useRef(null);
      const reconnRef = useRef(null);
      const [connected, setConnected] = useState(false);

      const connect = useCallback(() => {
        try {
          const ws = createWebSocket();
          wsRef.current = ws;
          ws.onopen = () => { setConnected(true); if (reconnRef.current) { clearTimeout(reconnRef.current); reconnRef.current = null; } };
          ws.onmessage = (e) => { try { onMessage && onMessage(JSON.parse(e.data)); } catch { } };
          ws.onclose = () => { setConnected(false); reconnRef.current = setTimeout(connect, 3000); };
          ws.onerror = () => ws.close();
        } catch { reconnRef.current = setTimeout(connect, 5000); }
      }, [onMessage]);

      useEffect(() => {
        connect();
        return () => { wsRef.current?.close(); if (reconnRef.current) clearTimeout(reconnRef.current); };
      }, [connect]);

      return { connected };
    }

    // ─── TradingChart ─────────────────────────────────────────────────────────────
    const SIGNAL_STYLES = {
      FIRST_HIGH: { color: "#f59e0b", shape: "circle", position: "aboveBar", text: "FH", size: 2 },
      FIRST_LOW: { color: "#f59e0b", shape: "circle", position: "belowBar", text: "FL", size: 2 },
      NEW_HIGH: { color: "#22c55e", shape: "circle", position: "aboveBar", text: "NH", size: 1.5 },
      NEW_LOW: { color: "#ef4444", shape: "circle", position: "belowBar", text: "NL", size: 1.5 },
      LAST_HIGH: { color: "#f59e0b", shape: "circle", position: "aboveBar", text: "LH", size: 2 },
      LAST_LOW: { color: "#f59e0b", shape: "circle", position: "belowBar", text: "LL", size: 2 },
    };
    const IST_OFFSET = 19800;

    function snapToCandle(ts, sorted) {
      if (!sorted?.length) return ts;
      let lo = 0, hi = sorted.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] < ts) lo = mid + 1; else hi = mid; }
      if (lo > 0 && Math.abs(sorted[lo - 1] - ts) <= Math.abs(sorted[lo] - ts)) return sorted[lo - 1];
      return sorted[lo];
    }
    const TYPE_LABEL_MAP = { FIRST_HIGH: "FH", FIRST_LOW: "FL", NEW_HIGH: "NH", NEW_LOW: "NL", LAST_HIGH: "LH", LAST_LOW: "LL" };
    function tsToISTDate(ts) {
      const d = new Date((ts + IST_OFFSET) * 1000);
      return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
    }
    // todayMode = true: 1M data fetched but only today's bubbles shown (all types), rolling-20 counter
    // isMultiDay (no todayMode): continuous NH/NL only, no FH/FL/LH/LL
    // single-day: all types, global 1->N counter
    function buildMarkers(signals, sortedTimes, todayMode) {
      if (!signals?.length) return [];
      const sorted = [...signals].sort((a, b) => a.ts - b.ts);
      const uniqueDays = new Set(sorted.map(s => tsToISTDate(s.ts)));
      const isMultiDay = uniqueDays.size > 1;
      const MULTIDAY_VISIBLE = new Set(["NEW_HIGH", "NEW_LOW"]);
      const dedupMap = new Map();
      for (const sig of sorted) {
        const style = SIGNAL_STYLES[sig.type];
        if (!style) continue;
        if (isMultiDay && !todayMode && !MULTIDAY_VISIBLE.has(sig.type)) continue;
        const t = snapToCandle(sig.ts, sortedTimes);
        const key = sig.type + "::" + t;
        if (!dedupMap.has(key)) dedupMap.set(key, { time: t, position: style.position, color: style.color, shape: style.shape, size: style.size, type: sig.type, dayStr: tsToISTDate(sig.ts) });
      }
      const markerList = Array.from(dedupMap.values()).sort((a, b) => a.time - b.time);
      let globalCounter = 0;
      return markerList.map(m => {
        globalCounter++;
        const num = ((globalCounter - 1) % 20);
        return { time: m.time, position: m.position, color: m.color, shape: m.shape, text: (TYPE_LABEL_MAP[m.type] || m.type) + " " + num, size: m.size };
      });
    }

    function TradingChart({ data, showEMA9High, showEMA9Low, showEMA9Close, onCrosshairMove, todayMode }) {
      const containerRef = useRef(null);
      const chartRef = useRef(null);
      const seriesRef = useRef({});
      const timesRef = useRef([]);

      useEffect(() => {
        if (!containerRef.current) return;
        const chart = LightweightCharts.createChart(containerRef.current, {
          width: containerRef.current.clientWidth,
          height: containerRef.current.clientHeight,
          layout: { background: { color: "#0a0e1a" }, textColor: "#8899bb", fontSize: 11, fontFamily: "'JetBrains Mono',monospace" },
          grid: { vertLines: { color: "#0f1929" }, horzLines: { color: "#0f1929" } },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
            vertLine: { color: "#3b82f6", width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: "#1e3a8a" },
            horzLine: { color: "#3b82f6", width: 1, style: LightweightCharts.LineStyle.Dashed, labelBackgroundColor: "#1e3a8a" },
          },
          rightPriceScale: { borderColor: "#1e2d4a", scaleMargins: { top: 0.08, bottom: 0.25 } },
          timeScale: {
            borderColor: "#1e2d4a", timeVisible: true, secondsVisible: false, rightOffset: 12, barSpacing: 8,
            tickMarkFormatter: (t) => { const d = new Date((t + IST_OFFSET) * 1000); return String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0"); },
          },
          localization: {
            timeFormatter: (t) => { const d = new Date((t + IST_OFFSET) * 1000); return String(d.getUTCDate()).padStart(2, "0") + "/" + String(d.getUTCMonth() + 1).padStart(2, "0") + " " + String(d.getUTCHours()).padStart(2, "0") + ":" + String(d.getUTCMinutes()).padStart(2, "0") + " IST"; },
          },
          handleScroll: { mouseWheel: true, pressedMouseMove: true },
          handleScale: { mouseWheel: true, pinch: true },
        });
        chartRef.current = chart;

        const candleSeries = chart.addCandlestickSeries({ upColor: "#22c55e", downColor: "#ef4444", borderUpColor: "#16a34a", borderDownColor: "#dc2626", wickUpColor: "#22c55e", wickDownColor: "#ef4444" });
        const volumeSeries = chart.addHistogramSeries({ color: "#26a69a", priceFormat: { type: "volume" }, priceScaleId: "vol" });
        chart.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 }, borderVisible: false });
        const ema9H = chart.addLineSeries({ color: "#3b82f6", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: true, title: "EMA9H" });
        const ema9L = chart.addLineSeries({ color: "#f97316", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: true, title: "EMA9L" });
        const ema9C = chart.addLineSeries({ color: "#a855f7", lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, priceLineVisible: false, lastValueVisible: true, title: "EMA9C" });

        seriesRef.current = { candleSeries, volumeSeries, ema9H, ema9L, ema9C };
        chart.subscribeCrosshairMove(p => onCrosshairMove && onCrosshairMove(p));

        const ro = new ResizeObserver(() => {
          if (containerRef.current) chart.applyOptions({ width: containerRef.current.clientWidth, height: containerRef.current.clientHeight });
        });
        ro.observe(containerRef.current);
        return () => { ro.disconnect(); chart.remove(); };
      }, []);

      useEffect(() => { seriesRef.current.ema9H?.applyOptions({ visible: showEMA9High }); }, [showEMA9High]);
      useEffect(() => { seriesRef.current.ema9L?.applyOptions({ visible: showEMA9Low }); }, [showEMA9Low]);
      useEffect(() => { seriesRef.current.ema9C?.applyOptions({ visible: showEMA9Close }); }, [showEMA9Close]);

      useEffect(() => {
        if (!data?.candles?.length || !seriesRef.current.candleSeries) return;
        const { candles, signals } = data;
        const cd = candles.map(c => ({ time: c.ts, open: c.open, high: c.high, low: c.low, close: c.close }));
        const vd = candles.map(c => ({ time: c.ts, value: c.volume || 0, color: c.close >= c.open ? "rgba(34,197,94,.35)" : "rgba(239,68,68,.35)" }));
        timesRef.current = cd.map(c => c.time).sort((a, b) => a - b);
        seriesRef.current.candleSeries.setData(cd);
        seriesRef.current.volumeSeries.setData(vd);
        seriesRef.current.ema9H.setData(candles.filter(c => c.ema9High != null).map(c => ({ time: c.ts, value: c.ema9High })));
        seriesRef.current.ema9L.setData(candles.filter(c => c.ema9Low != null).map(c => ({ time: c.ts, value: c.ema9Low })));
        seriesRef.current.ema9C.setData(candles.filter(c => c.ema9Close != null).map(c => ({ time: c.ts, value: c.ema9Close })));
        seriesRef.current.candleSeries.setMarkers(buildMarkers(signals || [], timesRef.current, todayMode));
        chartRef.current?.timeScale().fitContent();
      }, [data]);

      return React.createElement("div", { ref: containerRef, style: { width: "100%", height: "100%" } });
    }

    // ─── SignalLegend ─────────────────────────────────────────────────────────────
    const TYPE_META = {
      FIRST_HIGH: { label: "First Candle High", color: "#f59e0b", bg: "#1c1200", dot: "●" },
      FIRST_LOW: { label: "First Candle Low", color: "#f59e0b", bg: "#1c1200", dot: "●" },
      NEW_HIGH: { label: "New High", color: "#22c55e", bg: "#052e16", dot: "●" },
      NEW_LOW: { label: "New Low", color: "#ef4444", bg: "#2d0808", dot: "●" },
      LAST_HIGH: { label: "Last Candle High", color: "#f59e0b", bg: "#1c1200", dot: "○" },
      LAST_LOW: { label: "Last Candle Low", color: "#f59e0b", bg: "#1c1200", dot: "○" },
    };
    function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false }); }

    const TYPE_ABBR = { FIRST_HIGH: "FH", FIRST_LOW: "FL", NEW_HIGH: "NH", NEW_LOW: "NL", LAST_HIGH: "LH", LAST_LOW: "LL" };
    function SignalLegend({ signals }) {
      const byType = useMemo(() => {
        const m = {};
        for (const s of (signals || [])) { if (!m[s.type]) m[s.type] = []; m[s.type].push(s); }
        return m;
      }, [signals]);
      const order = ["FIRST_HIGH", "FIRST_LOW", "NEW_HIGH", "NEW_LOW", "LAST_HIGH", "LAST_LOW"];
      const present = order.filter(t => byType[t]?.length > 0);
      if (!present.length) return React.createElement("div", { style: { padding: "12px 16px", color: "#3b5280", fontSize: 12, textAlign: "center" } }, "No signals yet today");
      return React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 4, padding: "8px 0" } },
        present.map(type => {
          const meta = TYPE_META[type];
          const abbr = TYPE_ABBR[type];
          const list = byType[type];
          const latest = list[list.length - 1];
          return React.createElement("div", { key: type, style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 12px", borderRadius: 6, background: meta.bg, border: "1px solid " + meta.color + "22" } },
            React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8 } },
              React.createElement("span", { style: { color: meta.color, fontSize: 14, lineHeight: 1 } }, meta.dot),
              React.createElement("div", null,
                React.createElement("div", { style: { fontSize: 11, color: "#94a3b8", fontFamily: "'JetBrains Mono',monospace" } }, meta.label),
                React.createElement("div", { style: { display: "flex", flexWrap: "wrap", gap: 3, marginTop: 3 } },
                  list.map((sig, i) => React.createElement("span", { key: i, style: { fontSize: 9, fontFamily: "'JetBrains Mono',monospace", color: meta.color, background: meta.color + "18", border: "1px solid " + meta.color + "33", borderRadius: 3, padding: "1px 4px" } },
                    abbr + (i + 1) + " · " + fmtTime(sig.ts)
                  ))
                )
              )
            ),
            React.createElement("div", { style: { textAlign: "right", flexShrink: 0, marginLeft: 8 } },
              React.createElement("div", { style: { fontSize: 12, fontFamily: "'JetBrains Mono',monospace", color: meta.color, fontWeight: 600 } }, "₹" + latest.price.toFixed(2)),
              list.length > 1 && React.createElement("div", { style: { fontSize: 10, color: "#3b5280" } }, "×" + list.length)
            )
          );
        })
      );
    }

    // ─── StatusBar ────────────────────────────────────────────────────────────────
    function StatusBar({ status, connected, lastUpdate, onForceRefresh }) {
      const isMarket = status?.marketOpen;
      const s = (color, children, ...rest) => React.createElement("span", { style: { color }, ...(rest[0] || {}) }, children);
      return React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 12, padding: "0 16px", height: 32, background: "#060b14", borderBottom: "1px solid #0f1929", fontSize: 11, fontFamily: "'JetBrains Mono',monospace", flexShrink: 0 } },
        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 5 } },
          React.createElement("span", { style: { width: 6, height: 6, borderRadius: "50%", background: connected ? "#22c55e" : "#ef4444", boxShadow: connected ? "0 0 6px #22c55e88" : "0 0 6px #ef444488", display: "inline-block" } }),
          s(connected ? "#22c55e" : "#ef4444", connected ? "LIVE" : "DISCONNECTED")
        ),
        s("#1e2d4a", "│"),
        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 5 } },
          React.createElement("span", { style: { width: 6, height: 6, borderRadius: "50%", background: isMarket ? "#22c55e" : "#64748b", display: "inline-block", animation: isMarket ? "pulse 2s infinite" : "none" } }),
          s(isMarket ? "#94a3b8" : "#4b6899", isMarket ? "MARKET OPEN" : "MARKET CLOSED")
        ),
        React.createElement("div", { style: { flex: 1 } }),
        lastUpdate && s("#3b5280", "Updated: ", {}, React.createElement("span", { style: { color: "#64748b" } }, lastUpdate)),
        React.createElement("button", { onClick: onForceRefresh, style: { background: "transparent", border: "1px solid #1e2d4a", color: "#4b6899", padding: "2px 8px", borderRadius: 4, cursor: "pointer", fontSize: 10, fontFamily: "'JetBrains Mono',monospace" } }, "↻ REFRESH")
      );
    }

    // ─── SymbolSearch ─────────────────────────────────────────────────────────────
    function SymbolSearch({ symbols, selected, onSelect }) {
      const [query, setQuery] = useState("");
      const [open, setOpen] = useState(false);
      const [hi, setHi] = useState(0);
      const inputRef = useRef(null);

      const disp = s => s.replace("NSE:", "").replace("NFO:", "").replace("-EQ", "").replace("FUT", "");
      const filtered = useMemo(() => {
        if (!query.trim()) return symbols.slice(0, 50);
        const q = query.toUpperCase();
        return symbols.filter(s => s.includes(q) || s.replace("NSE:", "").replace("-EQ", "").includes(q)).slice(0, 50);
      }, [query, symbols]);

      useEffect(() => { setHi(0); }, [filtered]);

      function handleKey(e) {
        if (!open) { setOpen(true); return; }
        if (e.key === "ArrowDown") { e.preventDefault(); setHi(h => Math.min(h + 1, filtered.length - 1)); }
        if (e.key === "ArrowUp") { e.preventDefault(); setHi(h => Math.max(h - 1, 0)); }
        if (e.key === "Enter" && filtered[hi]) pick(filtered[hi]);
        if (e.key === "Escape") setOpen(false);
      }
      function pick(sym) { onSelect(sym); setQuery(""); setOpen(false); }

      return React.createElement("div", { style: { position: "relative", width: "100%" } },
        React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8, background: "#0d1221", border: "1px solid #1e2d4a", borderRadius: 8, padding: "0 12px", height: 40 } },
          React.createElement("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "#4b6899", strokeWidth: 2 },
            React.createElement("circle", { cx: 11, cy: 11, r: 8 }), React.createElement("path", { d: "m21 21-4.35-4.35" })
          ),
          React.createElement("input", { ref: inputRef, value: query, onChange: e => { setQuery(e.target.value); setOpen(true) }, onFocus: () => setOpen(true), onBlur: () => setTimeout(() => setOpen(false), 150), onKeyDown: handleKey, placeholder: selected ? disp(selected) : "Search symbol…", style: { background: "transparent", border: "none", outline: "none", color: "#e2e8f0", fontSize: 13, fontFamily: "'JetBrains Mono',monospace", width: "100%", letterSpacing: .3 } }),
          selected && React.createElement("span", { style: { fontSize: 10, color: "#22c55e", background: "#052e16", padding: "2px 6px", borderRadius: 4, whiteSpace: "nowrap", fontFamily: "'JetBrains Mono',monospace" } }, disp(selected))
        ),
        open && filtered.length > 0 && React.createElement("div", { style: { position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, zIndex: 100, background: "#0d1221", border: "1px solid #1e2d4a", borderRadius: 8, maxHeight: 280, overflowY: "auto", boxShadow: "0 8px 32px rgba(0,0,0,.6)" } },
          filtered.map((sym, i) => React.createElement("div", { key: sym, onMouseDown: () => pick(sym), style: { padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", background: i === hi ? "#131d35" : "transparent", borderBottom: "1px solid #0f1929" } },
            React.createElement("span", { style: { fontFamily: "'JetBrains Mono',monospace", fontSize: 12, color: "#e2e8f0", letterSpacing: .3 } }, disp(sym)),
            React.createElement("span", { style: { fontSize: 10, color: "#3b5280" } }, sym.split(":")[0])
          ))
        )
      );
    }

    // ─── TimeframeSelector ────────────────────────────────────────────────────────
    const RESOLUTIONS = [
      { label: "1m", resolution: "1", timeframe: "1d" },
      { label: "3m", resolution: "3", timeframe: "1d" },
      { label: "5m", resolution: "5", timeframe: "5d" },
      { label: "15m", resolution: "15", timeframe: "5d" },
      { label: "1h", resolution: "60", timeframe: "1m" },
      { label: "1D", resolution: "D", timeframe: "1m" },
    ];
    function TimeframeSelector({ active, onChange }) {
      return React.createElement("div", { style: { display: "flex", gap: 2, background: "#060b14", border: "1px solid #0f1929", borderRadius: 6, padding: 2 } },
        RESOLUTIONS.map(r => {
